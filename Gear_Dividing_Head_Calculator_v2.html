<!doctype html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1565c0"><title>Gear Dividing Head Calculator</title>
<style>body{font-family:Arial,sans-serif;background:#eef2f5;margin:0;padding:14px;color:#17202a}.app{max-width:520px;margin:auto;background:#fff;padding:18px;border-radius:18px;box-shadow:0 2px 12px #0002}h1{font-size:21px;margin:0 0 4px}label{display:block;font-weight:bold;margin-top:14px}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid #aaa;border-radius:10px;font-size:16px}button{background:#1565c0;color:#fff;border:0;font-weight:bold}.result{margin-top:16px;padding:15px;border-radius:12px;background:#edf5ff;line-height:1.6}.small{font-size:13px;color:#65717e}.big{font-size:22px;font-weight:bold}</style></head>
<body><main class="app"><h1>⚙️ Gear Dividing Head Calculator</h1><div class="small">Simple + Compound Indexing</div>
<label>Gear Teeth / دانت</label><input id="teeth" type="number" min="1" value="37">
<label>Dividing Head Ratio</label><select id="ratio"><option value="40">40 : 1</option><option value="60">60 : 1</option><option value="80">80 : 1</option><option value="90">90 : 1</option><option value="120">120 : 1</option></select>
<label>Index Plate Hole Circles</label><input id="plates" value="15,16,17,18,19,20,21,23,27,29,31,33,37,39,41,43,47,49">
<button id="calc">حساب کریں / CALCULATE</button><div id="result" class="result"></div></main>
<script>
(function(){
function gcd(a,b){while(b){var t=a%b;a=b;b=t}return Math.abs(a)}
function calculate(){
 var N=parseInt(document.getElementById("teeth").value,10), R=parseInt(document.getElementById("ratio").value,10), out=document.getElementById("result");
 var circles=document.getElementById("plates").value.split(",").map(function(x){return parseInt(x.trim(),10)}).filter(function(x){return x>0});
 if(!N||!R){out.innerHTML="براہ کرم Teeth اور Ratio درست درج کریں۔";return}
 var whole=Math.floor(R/N), rem=R%N;
 if(rem===0){out.innerHTML="<div class='big'>"+whole+" مکمل چکر</div>Holes: 0";return}
 var g=gcd(rem,N), num=rem/g, den=N/g, hits=[];
 circles.forEach(function(c){var h=num*c/den;if(Number.isInteger(h))hits.push([c,h])});
 var s="<span class='small'>"+R+" ÷ "+N+" = "+whole+" + "+num+"/"+den+"</span><br><br>";
 if(hits.length){
   s+="<div class='big'>"+whole+" چکر + "+hits[0][1]+" holes</div>📌 "+hits[0][0]+" holes circle استعمال کریں۔";
 }else{
   s+="<b>Simple indexing نہیں بنی۔</b><br><br><b>Compound indexing کے لیے:</b><br>";
   var found=null;
   for(var i=0;i<circles.length && !found;i++)for(var j=0;j<circles.length && !found;j++)if(i!==j){
     var P=circles[i],Q=circles[j];
     for(var a=1;a<P && !found;a++)for(var b=1;b<Q && !found;b++){
       if(a*Q+b*P===num*P*Q/den) found=[P,Q,a,b,"same"];
       if(a*Q-b*P===num*P*Q/den) found=[P,Q,a,b,"opposite"];
       if(a*Q-b*P===-num*P*Q/den) found=[P,Q,a,b,"opposite"];
     }
   }
   if(found)s+="<b>"+whole+" مکمل چکر</b><br>Crank: "+found[2]+" holes on "+found[0]+" circle<br>Index plate: "+found[3]+" holes on "+found[1]+" circle ("+found[4]+" direction)";
   else s+="<span class='small'>موجودہ hole circles سے exact compound combination نہیں ملا۔</span>";
 }
 out.innerHTML=s;
}
document.getElementById("calc").addEventListener("click",calculate);calculate();
})();
</script></body></html>
