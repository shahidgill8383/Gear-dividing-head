<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gear Dividing Head Calculator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  background:#f2f4f7;
  font-family:Arial,"Noto Nastaliq Urdu",sans-serif;
  color:#222;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  color:#075985;
  font-size:27px;
  margin:10px 0 20px;
}

.card{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,button{
  width:100%;
  padding:13px;
  font-size:17px;
  border-radius:9px;
  border:1px solid #aaa;
}

button{
  margin-top:12px;
  background:#087f5b;
  color:white;
  border:0;
  font-weight:bold;
}

.ratio{
  background:#eef7ff;
  padding:12px;
  border-radius:9px;
  margin:12px 0;
  text-align:center;
  font-weight:bold;
}

.result{
  margin-top:15px;
  background:#f8fafc;
  border-radius:10px;
  padding:15px;
  border-right:5px solid #087f5b;
}

.big{
  font-size:21px;
  font-weight:bold;
  margin:8px 0;
}

.small{
  font-size:14px;
  color:#555;
  line-height:1.7;
}

.good{
  background:#e9f8ef;
  border-right-color:#198754;
}

.compound{
  background:#fff8e6;
  border-right-color:#e09f00;
}

.warning{
  background:#fff3cd;
  border-right-color:#e0a800;
  line-height:1.7;
}

.error{
  background:#ffe8e8;
  border-right-color:#c92a2a;
}

.solution{
  background:white;
  border:1px solid #ddd;
  border-radius:9px;
  padding:12px;
  margin:9px 0;
}

hr{
  border:0;
  border-top:1px solid #ddd;
  margin:15px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>⚙️ Gear Dividing Head Calculator</h1>

<div class="card">

<label>Gear Teeth / دانتوں کی تعداد</label>

<input id="teeth"
       type="number"
       min="2"
       max="1000"
       placeholder="مثلاً 46">

<div class="ratio">
Dividing Head Ratio: <b>40 : 1</b>
</div>

<label>Index Plate Hole Circles</label>

<input id="circles"
       value="15,16,17,18,19,20,21,23,27,29,31,33,37,39,41,43,47,49"
       placeholder="مثلاً 15,16,17,18...">

<button onclick="calculate()">Calculate</button>

</div>

<div id="output"></div>

</div>

<script>

const RATIO = 40;

function gcd(a,b){
  a=Math.abs(a);
  b=Math.abs(b);

  while(b){
    let t=a%b;
    a=b;
    b=t;
  }

  return a;
}

function fraction(n,d){

  if(d===0) return "";

  let g=gcd(Math.round(Math.abs(n)),Math.round(Math.abs(d)));

  n=Math.round(n/g);
  d=Math.round(d/g);

  if(d<0){
    n=-n;
    d=-d;
  }

  return n + "/" + d;
}

function closeEnough(a,b){
  return Math.abs(a-b) < 1e-10;
}

function parseCircles(){

  let text=document.getElementById("circles").value;

  let arr=text
    .split(",")
    .map(x=>parseInt(x.trim()))
    .filter(x=>Number.isInteger(x) && x>1);

  return [...new Set(arr)].sort((a,b)=>a-b);
}

function simpleIndexing(remainder,circles){

  let hits=[];

  for(let H of circles){

    let holes=remainder*H;

    if(closeEnough(holes,Math.round(holes))){

      let h=Math.round(holes);

      if(h>0 && h<H){

        hits.push({
          circle:H,
          holes:h
        });

      }
    }
  }

  return hits;
}

function compoundIndexing(remainder,circles){

  let solutions=[];

  for(let i=0;i<circles.length;i++){

    for(let j=i+1;j<circles.length;j++){

      let P=circles[i];
      let Q=circles[j];

      for(let a=1;a<P;a++){

        for(let b=1;b<Q;b++){

          let value=(a/P)+(b/Q);

          if(closeEnough(value,remainder)){

            solutions.push({
              P:P,
              Q:Q,
              a:a,
              b:b,
              type:"same",
              value:value
            });

          }

        }
      }

      for(let a=1;a<P;a++){

        for(let b=1;b<Q;b++){

          let value=(a/P)-(b/Q);

          if(closeEnough(value,remainder)){

            solutions.push({
              P:P,
              Q:Q,
              a:a,
              b:b,
              type:"opposite",
              value:value
            });

          }

        }
      }

    }
  }

  let unique=[];

  for(let s of solutions){

    let exists=unique.some(x =>
      x.P===s.P &&
      x.Q===s.Q &&
      x.a===s.a &&
      x.b===s.b &&
      x.type===s.type
    );

    if(!exists){
      unique.push(s);
    }

  }

  unique.sort((x,y)=>
    (x.a+x.b)-(y.a+y.b)
  );

  return unique.slice(0,8);
}

function calculate(){

  let teeth=parseInt(document.getElementById("teeth").value);

  let output=document.getElementById("output");

  if(!Number.isInteger(teeth) || teeth<2){

    output.innerHTML=`
      <div class="card result error">
        <div class="big">⚠️ Teeth کی تعداد درست درج کریں</div>
        <div class="small">
        مثال: 31، 46، 69، 93 وغیرہ
        </div>
      </div>
    `;

    return;
  }

  let circles=parseCircles();

  if(circles.length<2){

    output.innerHTML=`
      <div class="card result error">
        کم از کم دو hole circles درج کریں۔
      </div>
    `;

    return;
  }

  let exact=RATIO/teeth;

  let whole=Math.floor(exact);

  let remainder=exact-whole;

  let remFraction=fraction(
    RATIO % teeth,
    teeth
  );

  let html="";

  html+=`
  <div class="card result good">

    <div class="big">
      Required Crank Movement
    </div>

    <div class="big">
      40 ÷ ${teeth} =
      ${whole} + ${remFraction} turn
    </div>

    <div class="small">
      ہر tooth / division کے لیے crank کی یہ movement ہوگی۔
    </div>

  </div>
  `;

  if(closeEnough(remainder,0)){

    html+=`
    <div class="card result good">

      <div class="big">
        ✅ Simple Indexing
      </div>

      <div class="big">
        ${whole} مکمل چکر
      </div>

      <div class="small">
        Fractional movement کی ضرورت نہیں۔
      </div>

    </div>
    `;

    output.innerHTML=html;

    return;
  }

  let simple=simpleIndexing(remainder,circles);

  html+=`
  <div class="card result">

    <div class="big">
      🔵 Simple Indexing
    </div>
  `;

  if(simple.length){

    let s=simple[0];

    html+=`
      <div class="big">
        ${whole} مکمل چکر +
        ${s.holes} holes
        on ${s.circle} holes circle
      </div>

      <div class="small">
        یہ exact simple indexing ہے۔
      </div>
    `;

  }else{

    html+=`
      <div class="big">
        ❌ Simple Indexing نہیں بنتی
      </div>

      <div class="small">
        موجودہ hole circles میں
        ${remFraction}
        کو ایک ہی circle سے exact حاصل نہیں کیا جا سکتا۔
      </div>
    `;

  }

  html+=`
  </div>
  `;

  let compound=compoundIndexing(remainder,circles);

  html+=`
  <div class="card result compound">

    <div class="big">
      🟠 Compound Indexing
    </div>

    <div class="small">
      Fractional movement کو دو مختلف hole circles
      کے ذریعے exact حاصل کرنے کی کوشش کی گئی ہے۔
    </div>
  `;

  if(compound.length){

    if(simple.length){

      html+=`
      <div class="small">
        ⚠️ Simple indexing پہلے ہی available ہے۔
        نیچے compound کے exact alternatives صرف reference کے لیے ہیں۔
      </div>
      `;

    }

    compound.forEach((s,index)=>{

      let directionText="";

      if(s.type==="same"){

        directionText=`
          <b>Same Direction</b><br>
          Crank: ${s.a} holes on ${s.P} circle — CW<br>
          Plate: ${s.b} holes on ${s.Q} circle — CW
        `;

      }else{

        directionText=`
          <b>Opposite Direction</b><br>
          Crank: ${s.a} holes on ${s.P} circle — CW<br>
          Plate: ${s.b} holes on ${s.Q} circle — CCW
        `;

      }

      html+=`
      <div class="solution">

        <b>Compound Option ${index+1}</b>

        <hr>

        <div>
          ${whole} مکمل چکر
        </div>

        <div style="margin-top:8px">
          ${directionText}
        </div>

        <div class="small" style="margin-top:8px">
          Mathematical check:
          ${s.a}/${s.P}
          ${s.type==="same" ? "+" : "-"}
          ${s.b}/${s.Q}
          =
          ${remFraction}
        </div>

      </div>
      `;

    });

  }else{

    html+=`
      <div class="big">
        ❌ Compound solution نہیں ملی
      </div>

      <div class="small">
        موجودہ hole-circle list کے ساتھ اس gear کے لیے
        exact two-circle compound solution نہیں ملی۔
        اس صورت میں دوسری plate یا مختلف indexing method
        کی ضرورت ہو سکتی ہے۔
      </div>
    `;

  }

  html+=`
  </div>
  `;

  html+=`
  <div class="card result warning">

    <div class="big">
      ⚠️ Machine Setup Note
    </div>

    <div class="small">

      Compound indexing میں plate کو مقررہ direction
      میں حرکت دینی پڑ سکتی ہے۔

      <br><br>

      <b>
      CW / CCW direction اپنے dividing head کی actual
      construction کے مطابق لازمی verify کریں۔
      </b>

      <br><br>

      پہلے machine کو بغیر cutting کے test position پر
      چلا کر check کریں، خاص طور پر backlash اور worm
      direction کو verify کریں۔

    </div>

  </div>
  `;

  output.innerHTML=html;

}

</script>

</body>
</html>
