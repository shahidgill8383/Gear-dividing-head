<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1565c0">
<title>Gear Dividing Head Calculator</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f5;margin:0;padding:14px;color:#17202a}
.app{max-width:560px;margin:auto;background:#fff;padding:18px;border-radius:18px;box-shadow:0 2px 12px #0002}
h1{font-size:21px;margin:0 0 4px}.small{font-size:13px;color:#65717e}
label{display:block;font-weight:bold;margin-top:14px}
input,select,button{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid #aaa;border-radius:10px;font-size:16px}
button{background:#1565c0;color:#fff;border:0;font-weight:bold}
.result{margin-top:16px;padding:15px;border-radius:12px;background:#edf5ff;line-height:1.65}
.section{margin-top:12px;padding:13px;border-radius:12px;background:#fff;border:1px solid #d7e0e8}
.big{font-size:21px;font-weight:bold}.ok{font-weight:bold}.warn{font-weight:bold}
hr{border:0;border-top:1px solid #d7e0e8;margin:12px 0}
</style>
</head>
<body>
<main class="app">
<h1>⚙️ Gear Dividing Head Calculator</h1>
<div class="small">Simple + Compound Indexing</div>

<label>Gear Teeth / دانت</label>
<input id="teeth" type="number" min="1" step="1" value="37">

<label>Dividing Head Ratio</label>
<select id="ratio">
<option value="40">40 : 1</option>
<option value="60">60 : 1</option>
<option value="80">80 : 1</option>
<option value="90">90 : 1</option>
<option value="120">120 : 1</option>
</select>

<label>Index Plate Hole Circles</label>
<input id="plates" value="15,16,17,18,19,20,21,23,27,29,31,33,37,39,41,43,47,49">

<button id="calc" type="button">حساب کریں / CALCULATE</button>

<div id="result" class="result" aria-live="polite"></div>
</main>

<script>
(function(){
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a||1}
  function isInt(x){return Number.isInteger(x)}
  function fracText(n,d){var g=gcd(n,d);return (n/g)+"/"+(d/g)}

  function simpleIndex(N,R,circles){
    var whole=Math.floor(R/N), rem=R%N;
    if(rem===0) return {whole:whole,hits:[]};
    var g=gcd(rem,N), num=rem/g, den=N/g, hits=[];
    circles.forEach(function(c){
      var h=num*c/den;
      if(isInt(h) && h>0 && h<c) hits.push({circle:c,holes:h});
    });
    return {whole:whole,num:num,den:den,hits:hits};
  }

  /*
    Compound indexing:
    Find exact representation of the fractional crank turn as:
      a/P + b/Q
    or
      a/P - b/Q
    where P and Q are available hole circles.
    a and b are hole movements. A negative second term means the
    second movement is in the opposite direction.
  */
  function compoundIndex(N,R,circles){
    var rem=R%N;
    var whole=Math.floor(R/N);
    if(rem===0) return {whole:whole,solutions:[]};

    var g=gcd(rem,N), num=rem/g, den=N/g;
    var solutions=[];

    for(var ip=0;ip<circles.length;ip++){
      var P=circles[ip];
      for(var iq=0;iq<circles.length;iq++){
        var Q=circles[iq];
        if(P===Q) continue;

        for(var sign of [1,-1]){
          for(var a=0;a<P;a++){
            // b/Q = num/den - sign*a/P
            // b = Q*(num*P - sign*a*den)/(den*P)
            var numerator=Q*(num*P - sign*a*den);
            var denominator=den*P;
            if(numerator<=0) continue;
            if(numerator % denominator!==0) continue;
            var b=numerator/denominator;
            if(b>0 && b<Q){
              solutions.push({
                P:P,Q:Q,a:a,b:b,sign:sign
              });
              if(solutions.length>=8) return {whole:whole,num:num,den:den,solutions:solutions};
            }
          }
        }
      }
    }
    return {whole:whole,num:num,den:den,solutions:solutions};
  }

  function calculate(){
    var N=parseInt(document.getElementById("teeth").value,10);
    var R=parseInt(document.getElementById("ratio").value,10);
    var out=document.getElementById("result");
    var circles=document.getElementById("plates").value.split(",")
      .map(function(x){return parseInt(x.trim(),10)})
      .filter(function(x){return Number.isInteger(x)&&x>1});

    if(!N || N<1 || !R || !circles.length){
      out.innerHTML="براہ کرم Teeth، Ratio اور hole circles درست درج کریں۔";
      return;
    }

    var sidx=simpleIndex(N,R,circles);
    var cidx=compoundIndex(N,R,circles);
    var s="<div><b>Required crank movement:</b> "+R+" ÷ "+N+" = "+sidx.whole;
    if(sidx.num) s+=" + "+fracText(sidx.num,sidx.den);
    s+=" turn</div>";

    s+="<div class='section'><b>① Simple Indexing</b><hr>";
    if(sidx.hits.length){
      s+="<div class='big'>"+sidx.whole+" مکمل چکر + "+sidx.hits[0].holes+" holes</div>";
      s+="<div class='ok'>"+sidx.hits[0].circle+" holes circle استعمال کریں۔</div>";
      if(sidx.hits.length>1){
        s+="<div class='small'>دوسرے exact options: ";
        sidx.hits.slice(1).forEach(function(x,i){
          if(i) s+=", ";
          s+=x.holes+" holes on "+x.circle+" circle";
        });
        s+="</div>";
      }
    }else{
      s+="<div class='warn'>Simple indexing: موجودہ hole circles سے exact movement نہیں بنتی۔</div>";
    }
    s+="</div>";

    s+="<div class='section'><b>② Compound Indexing</b><hr>";
    if(cidx.solutions.length){
      var sol=cidx.solutions[0];
      s+="<div class='big'>"+cidx.whole+" مکمل چکر</div>";
      if(sol.a===0){
        s+="Plate movement: "+sol.b+" holes on "+sol.Q+" circle";
      }else if(sol.sign===1){
        s+="Crank: "+sol.a+" holes on "+sol.P+" circle<br>+ Plate: "+sol.b+" holes on "+sol.Q+" circle <b>(same direction)</b>";
      }else{
        s+="Crank: "+sol.a+" holes on "+sol.P+" circle<br>+ Plate: "+sol.b+" holes on "+sol.Q+" circle <b>(opposite direction)</b>";
      }
      if(cidx.solutions.length>1){
        s+="<div class='small'><br>مزید exact compound options بھی دستیاب ہیں۔</div>";
      }
    }else{
      s+="<div>موجودہ hole circles سے exact compound combination نہیں ملا۔</div>";
    }
    s+="</div>";

    s+="<div class='small' style='margin-top:12px'>⚠️ Compound indexing میں plate/crank کی direction اپنی dividing head کی manual کے مطابق verify کریں۔ مشین پر کٹ لگانے سے پہلے known test سے تصدیق کریں۔</div>";
    out.innerHTML=s;
  }

  document.getElementById("calc").addEventListener("click",calculate);
  calculate();
})();
</script>
</body>
</html>
